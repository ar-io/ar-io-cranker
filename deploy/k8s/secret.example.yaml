# Cranker keypair Secret — example only.
# DO NOT commit a real keypair! Use SealedSecrets, external-secrets,
# Vault, or your cloud KMS for production deployments.
#
# Create from a keypair file with kubectl:
#   kubectl create secret generic ar-io-cranker-keypair \
#     --from-file=cranker.json=/path/to/cranker-keypair.json
#
# Or apply this manifest after replacing the data below:
apiVersion: v1
kind: Secret
metadata:
  name: ar-io-cranker-keypair
type: Opaque
stringData:
  cranker.json: |
    [REPLACE_WITH_KEYPAIR_BYTES_ARRAY]
